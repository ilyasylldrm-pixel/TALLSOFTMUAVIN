name: Build & sync dist
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply deploy fixes (idempotent)
        run: node scripts/apply-deploy-fixes.mjs
      - name: Install & build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit built dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A server.ts dist
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor"
          else
            git commit -m "build: deploy düzeltmeleri + dist otomatik derleme [skip ci]"
            git push
          fi
