name: Build & Deploy to tallsoft.org

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tallsoft
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: server.ts Windows/IIS duzeltmeleri
        run: |
          # PORT zaten process.env.PORT; IIS host binding'i genis birak.
          perl -0pi -e 's/app\.listen\(PORT, "0\.0\.0\.0", \(\) => \{/app.listen(PORT, () => {/g' server.ts
          perl -0pi -e 's{const distPath = path\.join\(process\.cwd\(\), "dist"\);}{const distPath = __dirname;}g' server.ts
          perl -0pi -e 's/model: "gemini-3\.6-flash",/model: process.env.GEMINI_MODEL || "gemini-2.5-flash",/g' server.ts
      - name: Derleme
        run: |
          npm install
          npm run build
      - name: Deploy kaniti
        run: echo "actions-deploy OK | $(date -u +%FT%TZ) | ${GITHUB_SHA}" > dist/actions-deploy.txt
      - name: Sunucu .env olustur
        env:
          MYSOFT_CLIENT_ID: ${{ secrets.MYSOFT_CLIENT_ID || vars.MYSOFT_CLIENT_ID }}
          MYSOFT_CLIENT_SECRET: ${{ secrets.MYSOFT_CLIENT_SECRET || vars.MYSOFT_CLIENT_SECRET }}
        run: |
          if [ -z "$MYSOFT_CLIENT_ID" ] || [ -z "$MYSOFT_CLIENT_SECRET" ]; then
            echo "GitHub Secrets icinde MYSOFT_CLIENT_ID / MYSOFT_CLIENT_SECRET yok (Actions Variables degil, Secrets olmali)."
            exit 1
          fi
          umask 077
          {
            echo "MYSOFT_ENV=prod"
            echo "MYSOFT_GRANT_TYPE=client_credentials"
            printf 'MYSOFT_CLIENT_ID="%s"\n' "$MYSOFT_CLIENT_ID"
            printf 'MYSOFT_CLIENT_SECRET="%s"\n' "$MYSOFT_CLIENT_SECRET"
          } > /tmp/muavin.env
      - name: FTP deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || '31.186.11.163' }}
          FTP_USER: ${{ secrets.FTP_USER || 'tal2e0ftorg' }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          if [ -z "$FTP_PASS" ]; then
            echo "::error::GitHub Secrets icinde FTP_PASS tanimli degil!"
            exit 1
          fi
          echo "FTP baglantisi baslatiliyor: Kullanici: $FTP_USER -> Sunucu: $FTP_HOST"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp <<EOF
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:max-retries 2
          set net:timeout 30
          open "$FTP_HOST"
          user "$FTP_USER" "$FTP_PASS"
          mirror -R --delete --no-perms dist httpdocs/dist
          put server.ts -o httpdocs/server.ts
          put /tmp/muavin.env -o httpdocs/muavin.env
          put /tmp/muavin.env -o httpdocs/dist/muavin.env
          put /tmp/muavin.env -o muavin.env
          bye
          EOF

          # web.config dosyasini guncelleyerek IIS uygulamasini guvenle recycle et
          lftp <<EOF || true
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:max-retries 2
          set net:timeout 15
          open "$FTP_HOST"
          user "$FTP_USER" "$FTP_PASS"
          get httpdocs/web.config -o /tmp/wc || exit 0
          bye
          EOF

          if [ -f /tmp/wc ]; then
            printf '\n<!-- recycle %s -->\n' "$(date -u +%FT%TZ)" >> /tmp/wc
            lftp <<EOF || true
            set ftp:ssl-allow yes
            set ssl:verify-certificate no
            set ftp:passive-mode on
            open "$FTP_HOST"
            user "$FTP_USER" "$FTP_PASS"
            put /tmp/wc -o httpdocs/web.config
            bye
            EOF
          fi
